name: Maven Test CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: shopcart_user
          POSTGRES_PASSWORD: shopcart_password
          POSTGRES_DB: shopcart_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Java 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test with Maven
      run: cd backend && mvn clean test -DskipTests=false
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/shopcart_db
        SPRING_DATASOURCE_USERNAME: shopcart_user
        SPRING_DATASOURCE_PASSWORD: shopcart_password

    - name: Generate JaCoCo Report
      if: always()
      run: cd backend && mvn jacoco:report
      continue-on-error: true

    - name: Upload JaCoCo Coverage Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: jacoco-report
        path: backend/target/site/jacoco/
        retention-days: 30
      continue-on-error: true

    - name: Publish Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: backend/target/surefire-reports/**/*.xml
      continue-on-error: true

    - name: Code Coverage Comment
      if: always() && github.event_name == 'pull_request'
      uses: romeovs/lcov-reporter-action@v0.3.1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        lcov-file: ./backend/target/site/jacoco/jacoco.xml
      continue-on-error: true
